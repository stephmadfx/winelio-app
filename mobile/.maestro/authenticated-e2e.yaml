# Winelio mobile authenticated navigation
# E2E_EMAIL et E2E_PASSWORD sont fournis par le runner de test et ne sont pas
# stockés dans le dépôt.

appId: app.winelio.mobile
tags:
  - authenticated
  - ios
---
- launchApp
- runFlow:
    when:
      visible: "Accepter"
    commands:
      - tapOn:
          text: "Accepter"
- extendedWaitUntil:
    visible: "Se connecter"
    timeout: 30000
- tapOn:
    id: "email-pw"
- eraseText
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "password"
- eraseText
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Se connecter"
    index: 1
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Recommandez. Gagnez. Grandissez."
    timeout: 30000
- assertNotVisible:
    id: "webapp-error"
- tapOn: "Recos"
- extendedWaitUntil:
    visible: "Recommandations"
    timeout: 15000
- tapOn: "Réseau"
- extendedWaitUntil:
    visible: "Mon Réseau"
    timeout: 15000
- tapOn: "Gains"
- extendedWaitUntil:
    visible: "Portefeuille"
    timeout: 15000
- tapOn:
    text: "Fermer"
    optional: true
- tapOn: "Profil"
- extendedWaitUntil:
    visible: "Mon profil"
    timeout: 15000
- tapOn: "Accueil"
- extendedWaitUntil:
    visible: "Recommandez. Gagnez. Grandissez."
    timeout: 15000
