# À lancer via save-payment-method.spec.ts avec E2E_IOS_DEVICE :
# comptes éphémères créés et nettoyés par la fixture, application iOS installée.
appId: app.winelio.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "vous@exemple.com"
    timeout: 30000
- tapOn: "vous@exemple.com"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn: "Next"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- tapOn: "Done"
# WKWebView expose également le titre « Se connecter » comme cible tactile.
# Position du bouton vérifiée sur le simulateur iPhone 402 × 874, clavier fermé.
- tapOn:
    point: "50%,80%"
- extendedWaitUntil:
    visible: "RECOS"
    timeout: 30000
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Tout refuser"
    optional: true
- tapOn: "RECOS"
- tapOn:
    text: ".*Lead.*"
- scrollUntilVisible:
    element: "Reco test enregistrement carte"
    direction: DOWN
    timeout: 20000
- assertNotVisible: "js.stripe.com"
- takeScreenshot: output/playwright/ios-recommendation-without-stripe
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "RECOS"
    timeout: 30000
- tapOn: "RECOS"
- tapOn:
    text: ".*Lead.*"
- scrollUntilVisible:
    element: "Reco test enregistrement carte"
    direction: DOWN
    timeout: 20000
- assertNotVisible: "js.stripe.com"
- takeScreenshot: output/playwright/ios-recommendation-after-relaunch
